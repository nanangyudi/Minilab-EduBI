# docker-compose.yml
# Minilab EduBI — Deployment Lokal
#
# Services:
#   postgres  — Database PostgreSQL (source odoo_sim + analytics untuk Metabase)
#   app       — ETL Python (jalankan sekali: docker compose run app)
#   dbt       — dbt transformations (jalankan sekali: docker compose run dbt)
#   metabase  — Dashboard BI (jalan terus di background)
#
# Urutan penggunaan:
#   1. docker compose up -d postgres
#   2. docker compose run app
#   3. docker compose run dbt
#   4. docker compose up -d metabase

version: "3.9"

services:

  # ─────────────────────────────────────────────────────────
  # PostgreSQL: simulasi Odoo ERP + analytics untuk Metabase
  # ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: minilab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${PG_DB:-minilab}
      POSTGRES_USER:     ${PG_USER:-minilab}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-minilab123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-minilab} -d ${PG_DB:-minilab}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────
  # App / ETL: jalankan pipeline ETL Python
  # Akses: docker compose run app
  # ─────────────────────────────────────────────────────────
  app:
    build: .
    container_name: minilab_app
    working_dir: /app/etl
    command: python run_pipeline.py
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST:              postgres
      PG_PORT:              "5432"
      PG_DB:                ${PG_DB:-minilab}
      PG_USER:              ${PG_USER:-minilab}
      PG_PASSWORD:          ${PG_PASSWORD:-minilab123}
      DUCKDB_PATH:          /app/data/warehouse/lab_bi.duckdb
      RAW_DIR:              /app/data/raw
      USE_POSTGRES_SOURCE:  ${USE_POSTGRES_SOURCE:-false}
    volumes:
      - duckdb_data:/app/data/warehouse
      - ./data/raw:/app/data/raw:ro

  # ─────────────────────────────────────────────────────────
  # dbt: jalankan transformasi Bronze → Silver → Gold
  # Akses: docker compose run dbt
  # ─────────────────────────────────────────────────────────
  dbt:
    build: .
    container_name: minilab_dbt
    working_dir: /app/dbt_project
    command: >
      sh -c "
        cp profiles.yml.example profiles.yml &&
        sed -i 's|../data/warehouse/lab_bi.duckdb|/app/data/warehouse/lab_bi.duckdb|g' profiles.yml &&
        dbt deps --profiles-dir . &&
        dbt run  --profiles-dir . &&
        dbt test --profiles-dir . &&
        cd /app && python scripts/export_gold_to_postgres.py
      "
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST:     postgres
      PG_PORT:     "5432"
      PG_DB:       ${PG_DB:-minilab}
      PG_USER:     ${PG_USER:-minilab}
      PG_PASSWORD: ${PG_PASSWORD:-minilab123}
      DUCKDB_PATH: /app/data/warehouse/lab_bi.duckdb
    volumes:
      - duckdb_data:/app/data/warehouse

  # ─────────────────────────────────────────────────────────
  # Metabase: dashboard BI
  # Akses: http://localhost:3000
  # ─────────────────────────────────────────────────────────
  metabase:
    image: metabase/metabase:v0.50.0
    container_name: minilab_metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE:   postgres
      MB_DB_DBNAME: ${PG_DB:-minilab}
      MB_DB_PORT:   "5432"
      MB_DB_USER:   ${PG_USER:-minilab}
      MB_DB_PASS:   ${PG_PASSWORD:-minilab123}
      MB_DB_HOST:   postgres
    volumes:
      - metabase_data:/metabase-data

# ─────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: minilab_postgres_data
  duckdb_data:
    name: minilab_duckdb_data
  metabase_data:
    name: minilab_metabase_data

# ─────────────────────────────────────────────────────────
# Network (default bridge, cukup untuk PoC)
# ─────────────────────────────────────────────────────────
networks:
  default:
    name: minilab_network
