# docker-compose.yml
# Minilab EduBI — Deployment Lokal (Multi-Fase)
#
# Services dan profil aktif per fase:
#
#   postgres, clickhouse  — selalu aktif (tidak butuh profil)
#   [Fase 1 — BI Pipeline]
#     app, dbt            — dijalankan dengan: docker compose run --rm app/dbt
#     metabase            — docker compose --profile bi up -d
#   [Fase 2 — Data Mining]
#     jupyter, mlflow     — docker compose --profile analytics up -d
#
# Cara menjalankan:
#   Fase 1 saja   : docker compose up -d postgres clickhouse
#                   docker compose run --rm app && docker compose run --rm dbt
#                   docker compose --profile bi up -d metabase
#   Fase 2        : docker compose --profile analytics up -d
#   Fase 1 + 2    : docker compose --profile bi --profile analytics up -d postgres clickhouse metabase jupyter mlflow

version: "3.9"

services:

  # ─────────────────────────────────────────────────────────
  # PostgreSQL: simulasi Odoo ERP + metadata internal Metabase
  # ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: minilab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${PG_DB:-minilab}
      POSTGRES_USER:     ${PG_USER:-minilab}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-minilab123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-minilab} -d ${PG_DB:-minilab}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────
  # ClickHouse: Data Warehouse (Bronze / Silver / Gold)
  # HTTP interface: localhost:8123
  # ─────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: minilab_clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP interface (digunakan ETL, dbt, Metabase)
      - "9000:9000"   # Native interface (opsional)
    environment:
      CLICKHOUSE_DB:                      default
      CLICKHOUSE_USER:                    ${CH_USER:-default}
      CLICKHOUSE_PASSWORD:                ${CH_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────
  # App / ETL: load CSV sample → ClickHouse bronze
  # Akses: docker compose run --rm app
  # ─────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minilab_app
    working_dir: /app/etl
    command: python run_pipeline.py
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      CH_HOST:             clickhouse
      CH_PORT:             "8123"
      CH_USER:             ${CH_USER:-default}
      CH_PASSWORD:         ${CH_PASSWORD:-}
      PG_HOST:             postgres
      PG_PORT:             "5432"
      PG_DB:               ${PG_DB:-minilab}
      PG_USER:             ${PG_USER:-minilab}
      PG_PASSWORD:         ${PG_PASSWORD:-minilab123}
      RAW_DIR:             /app/data/raw
      USE_POSTGRES_SOURCE: ${USE_POSTGRES_SOURCE:-false}
    volumes:
      - ./data/raw:/app/data/raw

  # ─────────────────────────────────────────────────────────
  # dbt: transformasi Bronze → Silver → Gold di ClickHouse
  # Akses: docker compose run --rm dbt
  # ─────────────────────────────────────────────────────────
  dbt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minilab_dbt
    working_dir: /app/dbt_project
    command: >
      sh -c "
        cp profiles.yml.example profiles.yml &&
        dbt deps --profiles-dir . --target docker &&

        echo '' &&
        echo '┌─────────────────────────────────────────────┐' &&
        echo '│  Bronze dbt models (mirror sumber ETL)       │' &&
        echo '└─────────────────────────────────────────────┘' &&
        dbt run --select path:models/bronze --profiles-dir . --target docker &&

        echo '' &&
        echo '┌─────────────────────────────────────────────┐' &&
        echo '│  TAHAP 3 — Transform ke Silver (ClickHouse)  │' &&
        echo '└─────────────────────────────────────────────┘' &&
        dbt run --select path:models/silver --profiles-dir . --target docker &&

        echo '' &&
        echo '┌─────────────────────────────────────────────┐' &&
        echo '│  TAHAP 4 — Transform ke Gold (ClickHouse)    │' &&
        echo '└─────────────────────────────────────────────┘' &&
        dbt run --select path:models/gold --profiles-dir . --target docker &&

        echo '' &&
        echo '┌─────────────────────────────────────────────┐' &&
        echo '│  Validasi dbt Tests                          │' &&
        echo '└─────────────────────────────────────────────┘' &&
        dbt test --profiles-dir . --target docker
      "
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CH_HOST:     clickhouse
      CH_PORT:     "8123"
      CH_USER:     ${CH_USER:-default}
      CH_PASSWORD: ${CH_PASSWORD:-}

  # ─────────────────────────────────────────────────────────
  # Metabase: dashboard BI — connect langsung ke ClickHouse
  # Akses: http://localhost:3000
  # Profile: bi
  # ─────────────────────────────────────────────────────────
  metabase:
    build:
      context: .
      dockerfile: Dockerfile.metabase
    container_name: minilab_metabase
    restart: unless-stopped
    profiles: [bi]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      # Metabase menyimpan metadata-nya di PostgreSQL
      MB_DB_TYPE:   postgres
      MB_DB_DBNAME: ${PG_DB:-minilab}
      MB_DB_PORT:   "5432"
      MB_DB_USER:   ${PG_USER:-minilab}
      MB_DB_PASS:   ${PG_PASSWORD:-minilab123}
      MB_DB_HOST:   postgres
    volumes:
      - metabase_data:/metabase-data

  # ─────────────────────────────────────────────────────────
  # FASE 2 — Data Mining & Analitik Prediktif
  # ─────────────────────────────────────────────────────────

  # Jupyter Lab: eksplorasi data & eksperimen model
  # Akses: http://localhost:8888
  # Profile: analytics
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    container_name: minilab_jupyter
    profiles: [analytics]
    ports:
      - "8888:8888"
    environment:
      CH_HOST:     clickhouse
      CH_PORT:     "8123"
      CH_USER:     ${CH_USER:-default}
      CH_PASSWORD: ${CH_PASSWORD:-}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-minilab}
    volumes:
      - ./notebooks:/home/jovyan/work/notebooks
      - ./experiments:/home/jovyan/work/experiments
    depends_on:
      clickhouse:
        condition: service_healthy

  # MLflow: experiment tracking & model registry
  # Akses: http://localhost:5000
  # Profile: analytics
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.3
    container_name: minilab_mlflow
    profiles: [analytics]
    user: root
    ports:
      - "5000:5000"
    command:
      - "sh"
      - "-c"
      - "mkdir -p /mlflow/artifacts && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts"
    volumes:
      - ./experiments:/mlflow

# ─────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: minilab_postgres_data
  clickhouse_data:
    name: minilab_clickhouse_data
  metabase_data:
    name: minilab_metabase_data

# ─────────────────────────────────────────────────────────
# Network
# ─────────────────────────────────────────────────────────
networks:
  default:
    name: minilab_network
